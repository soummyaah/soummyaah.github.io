<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 110" width="200" height="110">
  <!--
    Leafy branch that frames your name on the home page.
    The left copy is shown as-is; CSS mirrors it for the right side.
    .berry is the small accent-coloured fruit. Match it to the accent colour in style.css.
  -->
  <style>
    .stem  { fill: none; stroke: #6E8F62; stroke-width: 2; stroke-linecap: round; }
    .twig  { fill: none; stroke: #6E8F62; stroke-width: 1.4; stroke-linecap: round; }
    .a { fill: #7FA36F; }
    .b { fill: #5E8A55; }
    .c { fill: #9DBE8C; }
    .berry { fill: #B4432A; }
  </style>
  <defs>
    <path id="leaf" d="M0 0 C6 -9 20 -11 30 0 C20 11 6 9 0 0 Z"/>
  </defs>

  <path class="stem" d="M196 58 C150 50 110 70 70 56 S20 40 4 52"/>
  <path class="twig" d="M110 62 C100 80 84 88 70 90"/>

  <use href="#leaf" xlink:href="#leaf" class="a" transform="translate(172 54) rotate(-150)"/>
  <use href="#leaf" xlink:href="#leaf" class="b" transform="translate(160 58) rotate(150) scale(1.1)"/>
  <use href="#leaf" xlink:href="#leaf" class="c" transform="translate(136 60) rotate(-160) scale(1.2)"/>
  <use href="#leaf" xlink:href="#leaf" class="a" transform="translate(124 64) rotate(160)"/>
  <use href="#leaf" xlink:href="#leaf" class="b" transform="translate(100 64) rotate(-150) scale(1.3)"/>
  <use href="#leaf" xlink:href="#leaf" class="c" transform="translate(88 84) rotate(170) scale(0.9)"/>
  <use href="#leaf" xlink:href="#leaf" class="a" transform="translate(66 56) rotate(-140) scale(1.2)"/>
  <use href="#leaf" xlink:href="#leaf" class="b" transform="translate(56 54) rotate(150)"/>
  <use href="#leaf" xlink:href="#leaf" class="c" transform="translate(34 46) rotate(-170) scale(1.1)"/>
  <use href="#leaf" xlink:href="#leaf" class="a" transform="translate(24 48) rotate(140) scale(0.9)"/>
  <circle class="berry" cx="70" cy="92" r="3.5"/>
  <circle class="berry" cx="78" cy="96" r="3"/>
</svg>
