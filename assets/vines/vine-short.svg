<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 140 760" width="140" height="760">
  <!--
    Shorter vine (used lower down and on the right edge, mirrored by CSS).
    Edit colours in <style>; see vine-long.svg for how leaves are placed.
  -->
  <style>
    .stem    { fill: none; stroke: #6E8F62; stroke-width: 2; stroke-linecap: round; }
    .tendril { fill: none; stroke: #6E8F62; stroke-width: 1.2; }
    .a { fill: #7FA36F; }
    .b { fill: #5E8A55; }
    .c { fill: #9DBE8C; }
  </style>
  <defs>
    <path id="leaf" d="M0 0 C6 -9 20 -11 30 0 C20 11 6 9 0 0 Z"/>
  </defs>

  <path class="stem" d="M18 0 C70 70 8 150 58 230 S28 390 76 470 S34 630 66 750"/>
  <path class="tendril" d="M58 230 C84 214 98 232 90 246 C84 256 72 250 76 242"/>

  <use href="#leaf" xlink:href="#leaf" class="b" transform="translate(30 40) rotate(-30) scale(1.1)"/>
  <use href="#leaf" xlink:href="#leaf" class="c" transform="translate(36 70) rotate(200)"/>
  <use href="#leaf" xlink:href="#leaf" class="a" transform="translate(34 120) rotate(-15) scale(1.2)"/>
  <use href="#leaf" xlink:href="#leaf" class="b" transform="translate(30 160) rotate(170) scale(0.9)"/>
  <use href="#leaf" xlink:href="#leaf" class="c" transform="translate(46 205) rotate(-40) scale(1.1)"/>
  <use href="#leaf" xlink:href="#leaf" class="b" transform="translate(52 260) rotate(190) scale(1.2)"/>
  <use href="#leaf" xlink:href="#leaf" class="a" transform="translate(40 320) rotate(10)"/>
  <use href="#leaf" xlink:href="#leaf" class="c" transform="translate(40 360) rotate(160) scale(1.1)"/>
  <use href="#leaf" xlink:href="#leaf" class="b" transform="translate(56 420) rotate(-25) scale(1.3)"/>
  <use href="#leaf" xlink:href="#leaf" class="a" transform="translate(70 470) rotate(200)"/>
  <use href="#leaf" xlink:href="#leaf" class="c" transform="translate(62 520) rotate(-10) scale(1.1)"/>
  <use href="#leaf" xlink:href="#leaf" class="b" transform="translate(50 580) rotate(175) scale(1.2)"/>
  <use href="#leaf" xlink:href="#leaf" class="a" transform="translate(50 640) rotate(-35) scale(0.9)"/>
  <use href="#leaf" xlink:href="#leaf" class="c" transform="translate(60 700) rotate(195) scale(1.1)"/>
  <circle class="c" cx="66" cy="752" r="3"/>
</svg>
